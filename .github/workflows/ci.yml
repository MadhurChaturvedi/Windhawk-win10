name: Windows 10 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build, Lint, Test & Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Lint codebase (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test suite (cargo test)
        run: cargo test --all --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Package portable distribution
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path ./dist -Force
          Copy-Item ./target/release/windhawk-win10.exe ./dist/
          Copy-Item ./README.md ./dist/
          Copy-Item ./LICENSE ./dist/
          Compress-Archive -Path ./dist/* -DestinationPath ./windhawk-win10-portable.zip -Force
          Get-Item ./windhawk-win10-portable.zip | Format-List Length, Name

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windhawk-win10-portable-x64
          path: windhawk-win10-portable.zip
          retention-days: 14

