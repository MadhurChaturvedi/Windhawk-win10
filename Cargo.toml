[workspace]
members = [
    "crates/core",
    "crates/gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Madhur Chaturvedi"]
license = "GPL-3.0-or-later"
repository = "https://github.com/MadhurChaturvedi/Windhawk-win10"
homepage = "https://github.com/MadhurChaturvedi/Windhawk-win10"
description = "Windows 10 standalone Notes Exporter for Windhawk"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
